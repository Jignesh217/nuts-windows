[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuts-windows"
version = "0.1.0"
description = "Windows port of Nuts - a system-tray AI companion (push-to-talk, screen-aware, on-device TTS)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Atharva" }]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nuts-windows = "nuts_windows.__main__:main"

[project.urls]
Source = "https://github.com/atharvalepse/nuts-windows"
Upstream = "https://github.com/atharvalepse/nuts"
